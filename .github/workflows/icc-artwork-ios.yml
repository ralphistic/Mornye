name: v5.4.5 ICC artwork iOS build

on:
  push:
    branches:
      - fix/v5.4.5-artwork-color-management
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      MORNYE_DISCORD_SDK: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        working-directory: rust_backend
        run: rustup show
      - name: Test artwork regression
        working-directory: rust_backend
        run: |
          cargo test --locked -p mornye-core cover:: -- --nocapture
      - name: Build Rust iOS backend
        run: bash scripts/build_rust_backend.sh ios
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Prepare Flutter SDK
        run: dart scripts/prepare_flutter_sdk.dart
      - name: Configure dependencies
        run: |
          flutter pub get
          dart scripts/gen_l10n.dart
          cd ios
          pod install
      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign --config-only --target lib/main.dart
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Runner.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
          cd ..
          python3 -m unittest discover -s scripts -p 'test_check_backend_ios.py'
          python3 scripts/check_backend_ios.py ios/build/Runner.xcarchive/Products/Applications/Runner.app --dsym ios/build/Runner.xcarchive/dSYMs/Runner.app.dSYM --backend rust --archs arm64 --platform ios --release
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          ditto ios/build/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qr Mornye-v5.4.5-ICC-unsigned.ipa Payload
          test -s Mornye-v5.4.5-ICC-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mornye-v5.4.5-icc-unsigned-ipa
          path: build/ios/ipa/Mornye-v5.4.5-ICC-unsigned.ipa
