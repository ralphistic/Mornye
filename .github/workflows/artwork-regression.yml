name: Artwork regression tests (no IPA)

on:
  push:
    branches:
      - fix/artwork-consistency-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Prepare Flutter SDK
        run: dart scripts/prepare_flutter_sdk.dart
      - name: Dependencies
        run: flutter pub get
      - name: Format check (changed files)
        run: dart format --output=none --set-exit-if-changed lib/widgets/local_library_artwork_builder.dart lib/screens/home_tab_widgets.dart lib/services/downloaded_embedded_cover_resolver.dart test/local_library_artwork_builder_test.dart
      - name: Analyze changed Dart code
        run: flutter analyze --no-pub lib/widgets/local_library_artwork_builder.dart lib/screens/home_tab_widgets.dart lib/services/downloaded_embedded_cover_resolver.dart test/local_library_artwork_builder_test.dart
      - name: Artwork regression tests
        run: flutter test test/local_library_artwork_builder_test.dart test/downloaded_embedded_cover_resolver_test.dart test/playback_artwork_test.dart
