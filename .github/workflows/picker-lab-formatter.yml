name: Picker Lab formatter (temporary)
on:
  push:
    branches: [fix/artwork-consistency-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
      - name: Format diagnostic Dart files and print patch
        run: |
          dart format lib/screens/settings/app_settings_page.dart lib/screens/settings/picker_lab_page.dart
          git diff -- lib/screens/settings/app_settings_page.dart lib/screens/settings/picker_lab_page.dart
