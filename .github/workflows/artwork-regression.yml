name: Artwork regression tests (no IPA)

on:
  push:
    branches:
      - fix/artwork-consistency-audit
  workflow_dispatch:

concurrency:
  group: artwork-regression-diagnostic-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Prepare Flutter SDK
        run: dart scripts/prepare_flutter_sdk.dart
      - name: Dependencies
        run: flutter pub get
      - name: Format and commit exact source under test
        run: |
          dart format lib/widgets/local_library_artwork_builder.dart lib/screens/home_tab_widgets.dart lib/services/downloaded_embedded_cover_resolver.dart lib/services/music_player_covers.dart lib/screens/mornye_library_screen.dart lib/widgets/library_search_results.dart lib/providers/local_library_provider.dart lib/providers/local_library_provider_scan.dart test/local_library_artwork_builder_test.dart test/downloaded_embedded_cover_resolver_test.dart
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "Apply Dart formatter to artwork regression changes"
            git push origin HEAD:fix/artwork-consistency-audit
          fi
      - name: Analyze changed Dart code
        run: flutter analyze --no-pub lib/widgets/local_library_artwork_builder.dart lib/screens/home_tab_widgets.dart lib/services/downloaded_embedded_cover_resolver.dart lib/services/music_player_covers.dart test/local_library_artwork_builder_test.dart
      - name: Embedded artwork resolver tests
        timeout-minutes: 5
        run: flutter test --reporter expanded --timeout 45s test/downloaded_embedded_cover_resolver_test.dart
      - name: Playback artwork regression tests
        timeout-minutes: 3
        run: flutter test --reporter expanded --timeout 45s test/playback_artwork_test.dart
      - name: FLAC artwork widget tests
        timeout-minutes: 2
        run: flutter test --reporter expanded --timeout 30s test/local_library_artwork_builder_test.dart
